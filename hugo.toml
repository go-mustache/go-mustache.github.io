baseURL = "https://go-mustache.github.io/"
languageCode = "en-us"
title = "go-mustache"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.07:1, bright on the dark background 6.06:1.
  base = "#78350f"
  deep = "#492009"
  bright = "#d97706"
  shadow = "rgba(120,53,15,.7)"
  glow = "rgba(120,53,15,.6)"
  wash = "rgba(120,53,15,.10)"
  washDeep = "rgba(73,32,9,.06)"
  chipBg = "#faefe1"
  chipBorder = "#f4d6b4"
  chipFg = "#492009"
  chipBgDark = "rgba(217,119,6,.14)"
  chipBorderDark = "rgba(217,119,6,.32)"
  chipFgDark = "#eab476"
  statsEnd = "#f6dec3"
  bandText = "#f9e9d7"
  accent = "#78350f"
  accentDark = "#d97706"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-mustache.github.io/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-mustache"
  label = "GitHub"
